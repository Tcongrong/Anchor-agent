<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Byte Stream Composer</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <section class="composer-panel" aria-labelledby="pageTitle">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local Stream Engine</p>
          <h1 id="pageTitle">Byte Stream Composer</h1>
        </div>
        <div class="status-pill" id="draftStatus">Engine ready</div>
      </header>
      <div class="layout-grid">
        <section class="note-editor" aria-label="Byte stream composer">
          <div id="streamComposer" data-stream-cmd="stream.push">
            <div class="field-row">
              <div class="field-stack">
                <span class="field-label">Format</span>
                <div class="radio-group" id="streamFormat" role="group" aria-label="Format">
                  <label><input type="radio" name="streamFormat" id="streamFormatHex" value="hex" checked> Hex</label>
                  <label><input type="radio" name="streamFormat" id="streamFormatBinary" value="binary"> Binary</label>
                  <label><input type="radio" name="streamFormat" id="streamFormatText" value="text"> Text</label>
                </div>
              </div>
              <div class="field-stack">
                <span class="field-label">Mode</span>
                <div class="radio-group" id="streamMode" role="group" aria-label="Mode">
                  <label><input type="radio" name="streamMode" id="streamModeRaw" value="raw" checked> Raw</label>
                  <label><input type="radio" name="streamMode" id="streamModeEncoded" value="encoded"> Encoded</label>
                  <label><input type="radio" name="streamMode" id="streamModeCompressed" value="compressed"> Compressed</label>
                </div>
              </div>
            </div>
            <label class="field-label" for="streamData">Byte data</label>
            <textarea id="streamData" rows="3" autocomplete="off" placeholder="Enter hex bytes or raw text"></textarea>
            <div class="action-row">
              <button id="runQueryButton" type="button">Transform</button>
              <span class="shortcut-copy">Local transform only</span>
            </div>
          </div>
        </section>
        <aside class="side-panel" aria-label="Query status">
          <div class="summary-grid">
            <div class="summary-tile">
              <span class="tile-label">Queued</span>
              <strong id="draftCount">0</strong>
            </div>
            <div class="summary-tile">
              <span class="tile-label">Formats</span>
              <strong>3</strong>
            </div>
            <div class="summary-tile">
              <span class="tile-label">Modes</span>
              <strong>3</strong>
            </div>
            <div class="summary-tile">
              <span class="tile-label">Remote</span>
              <strong>Off</strong>
            </div>
          </div>
          <div class="priority-strip" aria-hidden="true">
            <span class="tone-low"></span>
            <span class="tone-normal"></span>
            <span class="tone-high"></span>
          </div>
          <div class="preview-box">
            <p class="preview-title">Last stream</p>
            <p id="previewText">No stream pushed yet.</p>
          </div>
        </aside>
      </div>
      <section class="list-section" aria-label="Filter results">
        <div class="section-head">
          <h2>Pushed Streams</h2>
          <span id="listMeta">0 items</span>
        </div>
        <ul id="resultList"></ul>
      </section>
    </section>
  </main>
