<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Request Signer Console</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Integration Gateway</p>
          <h1>Request Signer Console</h1>
        </div>
        <div class="summary-strip" aria-label="Session summary">
          <span><strong id="visibleCount">0</strong> profiles</span>
          <span><strong id="pageNumber">1</strong> page</span>
          <span><strong id="layoutMode">compact</strong> layout</span>
        </div>
      </header>

      <section class="toolbar" aria-label="Request builder">
        <label>
          <span>API Endpoint</span>
          <input id="apiEndpoint" type="text" autocomplete="off" placeholder="/api/v2/resource" />
        </label>

        <label>
          <span>HTTP Method</span>
          <select id="httpMethod">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
          </select>
        </label>

        <label>
          <span>Auth Scheme</span>
          <select id="authScheme">
            <option value="none">None</option>
            <option value="bearer">Bearer</option>
            <option value="apikey">API Key</option>
          </select>
        </label>

        <label>
          <span>Request body</span>
          <input id="requestBody" type="text" autocomplete="off" placeholder="key=value&key2=value2" />
        </label>

        <label class="toggle-row">
          <span>Replay guard</span>
          <input id="replayGuard" type="checkbox" />
        </label>

        <div class="button-row">
          <button id="stageRequest" data-action="request.session.stage" type="button">Stage</button>
          <button id="sealRequest" data-action="request.envelope.seal" type="button">Seal</button>
          <button id="signRequest" data-action="request.sign" type="button">Sign</button>
          <button data-action="request.form.reset" type="button">Reset</button>
        </div>
      </section>

      <section class="auxbar" aria-label="Console actions">
        <button data-action="request.export.preview" type="button">Export</button>
        <button data-action="request.history.prev" type="button">Prev</button>
        <button data-action="request.history.next" type="button">Next</button>
        <button data-action="request.headers.save" type="button">Save Headers</button>
        <button data-action="request.badge.refresh" type="button">Refresh Badges</button>
        <button data-action="request.view.pin" type="button">Pin View</button>
      </section>

      <section class="badge-line" aria-label="Request summary" id="filterBadges">
        <span class="badge muted">No request staged</span>
      </section>

      <section class="table-panel" aria-label="Signing log">
        <table>
          <thead>
            <tr>
              <th>Profile</th>
              <th>Method</th>
              <th>Scheme</th>
              <th>Endpoint</th>
              <th>Scope</th>
              <th>Nonce</th>
              <th>Region</th>
            </tr>
          </thead>
          <tbody id="invoiceRows"></tbody>
        </table>
      </section>

      <footer class="status-line">
        <span id="lastAction">Ready</span>
        <span id="shadowMarker" aria-hidden="true">sig_idle</span>
      </footer>
      <div id="localQueueNode" class="hidden-node" aria-hidden="true"></div>
    </main>
