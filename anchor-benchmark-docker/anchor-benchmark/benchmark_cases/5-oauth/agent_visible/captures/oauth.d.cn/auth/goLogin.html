<script>
  var ajaxLoading = false

  function pwdLgnErr(mes) {
    $('#pwdLgn .errmes').text(mes);
    $('#pwdLgn .errmes').animateCss('errShake faster'); 
  }

  function pheLgnErr(mes) {
    $('#pheLgn .errmes').text(mes);
    $('#pheLgn .errmes').animateCss('errShake faster'); 
  }

  function sendCodeCountDown() {
    var tickCount = 60
    var trg = '#send-code p'
    $("#send-code").css({'cursor':'default'})
    $(trg).text('已发送(' + tickCount + 's)').css({'color':'gray'})
    var titv = setInterval(function() {
      tickCount -= 1
      $(trg).text('已发送(' + tickCount + 's)')
      sendCodeCountDown.tickCount = tickCount
      if(tickCount === 0) {
        clearInterval(titv)
        $("#send-code").css({'cursor':'pointer'});
        $(trg).text('获取验证码').css({'color':'#ff7800'})
      }
    }, 1000);
  }

  function phoneNumCheck(){
    var phoneNumVal = $('input[name="phoneNum"]').val()
    if(!phoneNumVal){
      new pheLgnErr('请输入手机号码')
      return false
    }
    if(!(/^1\d{10}$/.test(phoneNumVal))){
      new pheLgnErr('请输入正确的手机号码')
      return false
    }
    new pheLgnErr('')
    return phoneNumVal
  }

  function verifyCodeCheck() {
    var verifyCodeVal = $('input[name="verifyCode"]').val()
    if(!verifyCodeVal){
      new pheLgnErr('请输入短信验证码')
      return false
    }
    if(!(/^\d{6}$/.test(verifyCodeVal))){
      new pheLgnErr('请输入正确的验证码')
      return false
    }
    new pheLgnErr('')
    return verifyCodeVal
  }

  function digoInteraction() {
    var digoRect = $('.digo').get(0).getBoundingClientRect()
    var halfWidth = digoRect.width / 2
    var halfHeigth = digoRect.height / 2
    var digoCenter = { x: digoRect.left + halfWidth, y: digoRect.top + halfHeigth }

    function mDeci(num) { return parseInt(num * 100) / 100 }

    function cleanTransition(time) {
      setTimeout(function() {
        $('.digo .digob').css({'transition': ''})
        $('.digo .digoc').css({'transition': ''})
      }, time)
    }

    function getGa(e) {
      var xg = (e.pageX - digoCenter.x) / halfWidth
      var yg = (e.pageY - digoCenter.y) / halfHeigth
      xga = mDeci(xg) * 8 + 'px'
      yga = mDeci(yg) * 8 + 'px'
      return {xga: xga, yga: yga}
    }

    $('.digo')
    .on('mouseenter', function(e) {
      var ga = getGa(e)
      $('.digo .digob').css({
        'transform': 'translate3d(' + ga.xga + ',' + ga.yga + ', 0)',
        'transition': 'transform 0.2s'
      })
      $('.digo .digoc').css({
        'transform': 'translate3d(0,' + ga.yga + ', 0)',
        'transition': 'transform 0.2s'
      })
      cleanTransition(200)
    })
    .on('mousemove', function(e) {
      var ga = getGa(e)
      $('.digo .digob').css('transform', 'translate3d(' + ga.xga + ',' + ga.yga + ', 0)')
      $('.digo .digoc').css('transform', 'translate3d(0,' + ga.yga + ', 0)')
    })
    .on('mouseleave', function(e) {
      var ends = {
        'transform': 'translate3d(0, 0, 0)',
        'transition': 'transform 0.3s'
      }
      $('.digo .digob').css(ends)
      $('.digo .digoc').css(ends)
      cleanTransition(300)
    })
  }
</script>
<script>
  var flag = false;
  var reqId = '';
  var to = "https://www.d.cn/"
  //密码加密
  var rsa = function (arg) {
      setMaxDigits(130);
      var PublicExponent = "10001";
      var modulus = "be44aec4d73408f6b60e6fe9e3dc55d0e1dc53a1e171e071b547e2e8e0b7da01c56e8c9bcf0521568eb111adccef4e40124b76e33e7ad75607c227af8f8e0b759c30ef283be8ab17a84b19a051df5f94c07e6e7be5f77866376322aac944f45f3ab532bb6efc70c1efa524d821d16cafb580c5a901f0defddea3692a4e68e6cd";
      var key = new RSAKeyPair(PublicExponent, "", modulus);
      return encryptedString(key, arg);
  };
  // digo interaction
  new digoInteraction()

  // input active
  $('.frmctr input').focus(function(){
    $(this).parent().parent().addClass('actived')
  }).blur(function(){
    if(!$(this).val()) $(this).parent().parent().removeClass('actived')
  }).on('input',function () {
    //清除错误提示框中内容
    $('#pheLgn .errmes').text("");
    $('#pwdLgn .errmes').text("");
  })

  // switch password login and phone login
  $('#st-pwdLgn').click(function() {
    $('#st-pwdLgn').addClass('actived')
    $('#st-pheLgn').removeClass('actived')
    $('#pheLgn').hide()
    $('#pwdLgn').show()
    $('#pwdLgn').animateCss('frmZoomIn faster')
  })
  $('#st-pheLgn').click(function() {
    $('#st-pwdLgn').removeClass('actived')
    $('#st-pheLgn').addClass('actived')
    $('#pheLgn').show()
    $('#pwdLgn').hide()
    $('#pheLgn').animateCss('frmZoomIn faster')
  })

  // switch qrlft and pwdphelft
  $('#st-qrlft').click(function() {
    $('#qrlft').show()
    $('#st-qrlft').hide()
    $('#pwdphelft').hide()
    $('#st-pwdphelft').show()
    $('#qrlft').animateCss('lftZoomIn faster')
  })
  $('#st-pwdphelft').click(function() {
    $('#qrlft').hide()
    $('#st-qrlft').show()
    $('#pwdphelft').show()
    $('#st-pwdphelft').hide()
    $('#pwdphelft').animateCss('lftZoomIn faster')
  })

  // switch password input type
  $('.password-show').click(function(){
    var $ctr =  $(this).parent()
    $(this).hide()
    $ctr.children('.password-hide').show()
    $ctr.find('input').attr('type', 'text')
  })
  $('.password-hide').click(function(){
    var $ctr =  $(this).parent()
    $(this).hide()
    $ctr.children('.password-show').show()
    $ctr.find('input').attr('type', 'password')
  })

  // user agreement
  new userAgmt('openusrgmt')

  // send verify code
  var sendCode = function(captchaObj){
      captchaObj.onSuccess(function () {
          var result = captchaObj.getValidate();
          if (!result) {
              captchaObj.reset();
          }
          var phoneNum = phoneNumCheck()
          ajaxLoading = true
          $.post("https://oauth.d.cn/auth/sendPhoneLoginOrRegisterVcode?display=web", {phone: phoneNum,
              geetest_challenge:  result.geetest_challenge,
              geetest_validate:result.geetest_validate,
              geetest_seccode:result.geetest_seccode})
              .success(function(data){
                  if(data.code != 2000){
                      if(typeof(data.error)!="undefined"){
                          new pheLgnErr(data.error)
                          if(data.error.indexOf('您操作过快') != -1){
                              setTimeout("$('.errmes').text('')",2000)
                          }
                      }else{
                          new pheLgnErr('验证码发送失败，请重新发送！')
                      }
                      captchaObj.reset();
                  }else {
                      new pheLgnErr('验证码已发送！')
                      setTimeout("$('#pheLgn .errmes').text('')",2000)
                      sendCodeCountDown()
                  }
              })
              .error(function() {new pheLgnErr('发送失败') })
              .complete(function(){ ajaxLoading = false })
      });
      $('#send-code').click(function () {
          var phoneNum = phoneNumCheck()
          if(!phoneNum || ajaxLoading || sendCodeCountDown.tickCount) return
          $('#pheLgn .errmes').text("");
          captchaObj.verify();
      })
  };

  // submit action
  var pwdFormLogin = function(){
      var accountVal = $('input[name="account"]').val()
      var passwordVal = $('input[name="password"]').val()
      if(!accountVal){ new pwdLgnErr('请输入帐号'); return }
      if(!passwordVal){ new pwdLgnErr('请输入密码'); return }
      var rsaPwd;
      var validData = captchaObj.getValidate();
      if (!flag ||(flag && validData)) {
          rsaPwd = rsa(passwordVal);
      }else{
          new pwdLgnErr("请先完成图形验证")
          captchaObj.reset();
          return
      }
      var submitData;
      if(validData){
          submitData = {
              name: accountVal,
              pwd:rsaPwd, to:to,
              reqId:reqId,
              geetest_challenge : validData.geetest_challenge,
              geetest_validate : validData.geetest_validate,
              geetest_seccode :  validData.geetest_seccode
          }
      }else{
          submitData = {
              name: accountVal,
              pwd:rsaPwd, to:to,
              reqId:reqId
          }
      }
      $.get("https://oauth.d.cn/auth/login?display=web",submitData)
          .success(function(data){
              if (9999 != data.code) {
                  
                  if(data.dialog) {
                      var temData = data.mess;
                      temData.toDate = toDate;
                      var html = tppl($('#alterHtml').html(),temData);
                      $('body').append(html);
                      return;
                  }
                  if(undefined == data.next){
                      new pwdLgnErr("出现未知错误，请刷新重试！");
                      captchaObj.reset();
                      return;
                  }
                  if (data.next.indexOf("oauth.d.cn") > -1) {
                      if (data.next.indexOf("?") > -1 || data.next.indexOf("%3F") > -1 ) {
                          window.location.href = decodeURIComponent(data.next + "&t=" + data.t);
                      } else {
                          window.location.href = decodeURIComponent(data.next + "?t=" + data.t)
                      }
                  } else {
                      window.location.href = decodeURIComponent(data.next);
                  }
                  return;
              }else if (data.desc || data.error || data.msg) {
                  $("#pwd").val("");
                  new pwdLgnErr(data.error || data.msg || data.desc);
                  // 生成极验，重新初始化极验
                  if (data.showValid == true) {
                      $("#valid").show();
                      flag = true;
                      captchaObj.reset();
                      if (reqId == '') {
                          $.when(getData3()).done(function(data){
                              cg=false;
                              if (data.code !== 9999 && data.showValid) {
                                  flag = true;
                                  reqId = data.reqId;
                              }else {
                                  flag = false;
                                  reqId = data.reqId;
                              }
                              if(data.code == 9999){
                                  new dcMess(data.error);
                                  $('input[name="account"]').focus();
                              }
                          });
                      }
                  }
              }
          })
          .error(function() { new pwdLgnErr('出错啦！') })
          .complete(function(){ ajaxLoading = false })
  }

  $('#pwdLgn button').click(pwdFormLogin);

  //手机一键登陆
  $('#pheLgn button').click(function(){
    if(ajaxLoading) return
    var phoneNum = phoneNumCheck()
    if(!phoneNum) return
    var verifyCode = verifyCodeCheck()
    if(!verifyCode) return

    ajaxLoading = true;
    $.get("https://oauth.d.cn/auth/loginOrRegisterByPhone?display=web", {phone: phoneNum,vcode:verifyCode,to:to})
      .success(function(data){
        if(data.code == 2000){
            
            if(data.dialog) {
                var temData = data.mess;
                temData.toDate = toDate;
                var html = tppl($('#alterHtml').html(),temData);
                $('body').append(html);
                return;
            }
          if (data.next.indexOf("?") > -1 || data.next.indexOf("%3F") > -1 ) {
            window.location.href = decodeURIComponent(data.next + "&t=" + data.t);
          } else {
            window.location.href = decodeURIComponent(data.next + "?t=" + data.t)
          }
        }else if(data.error){
            new pheLgnErr(data.error);
        }else{new pheLgnErr("出现未知错误，请刷新重试！");}
      })
      .error(function() { new pheLgnErr('出错啦！') })
      .complete(function(){ ajaxLoading = false })
  })


  /*******封停解封开始*/
  $(document).on('click','.alert-close',function(){
      $('.alert-box').remove();
  });
  function toDate(date){
      var time = new Date(date);
      return time.getFullYear() + '-' + (time.getMonth()+1<10?('0' + (time.getMonth()+1)):(time.getMonth()+1)) + '-' + (time.getDate()<10?('0'+time.getDate()):time.getDate()) + ' ' + (time.getHours()<10?('0'+time.getHours()):time.getHours()) + ':' + (time.getMinutes()<10?('0'+time.getMinutes()):time.getMinutes())
  }
  function tppl(tpl, data){
      var fn =  function(d) {
          var i, k = [], v = [];
          for (i in d) {
              k.push(i);
              v.push(d[i]);
          };
          return (new Function(k, fn.$)).apply(d, v);
      };
      if(!fn.$){
          var tpls = tpl.split('[:');
          fn.$ = "var $=''";
          for(var t = 0;t < tpls.length;t++){
              var p = tpls[t].split(':]');
              if(t!=0){
                  fn.$ += '='==p[0].charAt(0)
                      ? "+("+p[0].substr(1)+")"
                      : ";"+p[0].replace(/\r\n/g, '')+"$=$"
              }
              // 支持 <pre> 和 [::] 包裹的 js 代码
              fn.$ += "+'"+p[p.length-1].replace(/\'/g,"\\'").replace(/\r\n/g, '\\n').replace(/\n/g, '\\n').replace(/\r/g, '\\n')+"'";
          }
          fn.$ += ";return $;";
          // log(fn.$);
      }
      return data ? fn(data) : fn;
  }
  /*******封停解封end*/

  //极验
  //初始化发送验证码的极验

  //初始化安全校验的极验
  $.ajax({
      url: "https://oauth.d.cn/auth/gt/start?display=web&t=" + (new Date()).getTime(),
      type: "get",
      dataType: "json",
      success: function (data) {

              width : '100%',

    var type =1;
    var checkTimer=null,
        ajaxLoading=false,
        codeId=null;

    var toUrl=to?to:'https://www.d.cn';

    $('#st-qrlft').on('click',function(){
        genCode();

    genCode
    function genCode(){
        ajaxLoading=false;
        //reset default img
        $('.waitScan .codeShow img').attr('src','');
        $('.waitScan .codeShow .codeLoading').show();
        $.ajax({
            url:'https://oauth.d.cn/auth2/api/qrcode',
            type:'get',
            dataType:'json',
            success:function(res){
                codeId=res.data;
                var imgUrl="https://oauth.d.cn/auth2/api/qrcode/"+codeId+".png?type="+type;
                $('.waitScan .codeShow img').attr('src',imgUrl)
                //start checking function
                ajaxLoading=true;
                checkQRState();
                $('.waitScan .codeShow .codeLoading').hide();
            },
            error:function(){
                ajaxLoading=false;
                $('.waitScan').show();
                $('.waitScan .codeShow .timeOut').show();
            }
        })
    }

    //check
    function checkQRState(){
        checkTimer&&clearTimeout(checkTimer)
        $.ajax({
            url:'https://oauth.d.cn/auth/qrcodeLoginCheck?to='+toUrl+'&qrToken='+codeId+"&type="+type,
            // url:'http://rap2api.taobao.org/app/mock/164242/qrToken',
            type:'get',
            dataType:'json',
            success:function success(res){
                progressState=true;
                switch(res.code){
                    case -1://不存在或者过期
                        progressState=false;
                        $('.scanSuc').hide();
                        $('.logining').hide();
                        $('.waitScan').show();
                        $('.waitScan .codeShow .codeMask').show();
                        return;
                    case 1://扫描成功未确认
                        $('.waitScan').hide();
                        $('.scanSuc').show();
                        $('.logining').hide();
                        break;
                    case 2:  //取消
                        progressState=false;
                        $('.scanSuc').hide();
                        $('.logining').hide();
                        $('.waitScan').show();
                        $('.waitScan .codeShow .codeMask').show();
                        return;
                    case 3:
                        $('.waitScan').hide();
                        $('.scanSuc').hide();
                        $('.logining').show();
                        //跳珠指定页
                        if(res.to)
                            window.location.href=res.to
                        return;
                    default: //等待扫描
                }
                checkTimer=setTimeout(function(){
                    checkQRState()
                },3000)
            }
        })
    }

    //edit hover
    $('.codeShow').on('mouseenter',function(){
        if(ajaxLoading === true&&progressState=== true){
            $('.waitScan .notice').addClass("curr");
            $('.waitScan .codeShow').addClass('codeHover');
        }
    })
    $('.waitScan .mainCtx').on('mouseleave',function(){
        $('.waitScan .codeShow').removeClass('codeHover')
        $('.waitScan .notice').removeClass("curr")
    })
    //refresh click event
    $('.codeShow .timeOut,.codeMask .refresh').click(function(){
        $('.waitScan .codeShow .codeMask').hide();
        $('.waitScan .codeShow .timeOut').hide();
        genCode();
    })
