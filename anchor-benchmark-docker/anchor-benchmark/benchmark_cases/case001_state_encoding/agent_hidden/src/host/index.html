<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Verification</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="panel" aria-labelledby="accountTitle">
      <div class="brandline">
        <span class="mark" aria-hidden="true"></span>
        <span class="brandcopy">Verification desk</span>
      </div>
      <h1 id="accountTitle">Account Verification</h1>
      <form class="account-form" autocomplete="off">
        <label class="field" for="emailInput">
          <span>Email</span>
          <input id="emailInput" name="email" type="email" inputmode="email" placeholder="alice@example.com">
        </label>
        <label class="field" for="otpInput">
          <span>Short code</span>
          <input id="otpInput" name="otp" type="text" inputmode="numeric" maxlength="6" placeholder="483920">
        </label>
        <label class="remember" for="rememberDevice">
          <input id="rememberDevice" name="remember" type="checkbox">
          <span>Remember this device</span>
        </label>
        <button id="submitAccount" type="button" data-k="7:31:4">Submit</button>
      </form>
      <output id="statusLine" aria-live="polite">Ready</output>
    </section>
  </main>
  <script type="module" src="/src/z0/a0.js"></script>
</body>
</html>
