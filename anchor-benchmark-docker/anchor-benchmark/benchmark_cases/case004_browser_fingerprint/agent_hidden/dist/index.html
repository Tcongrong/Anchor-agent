<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browser Fingerprint Probe</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <section class="dashboard-panel" aria-labelledby="pageTitle">
      <header class="topbar">
        <div>
          <p class="eyebrow">Signal Intelligence</p>
          <h1 id="pageTitle">Browser Fingerprint Probe</h1>
        </div>
        <div class="status-pill" id="fpStatus">Ready</div>
      </header>
      <section class="control-strip" aria-label="Browser fingerprint probe controls">
        <div class="probe-panel" id="probePanel">
          <label class="field-stack" for="signalLevel">
            <span class="field-label">Signal Level</span>
            <select id="signalLevel">
              <option value="minimal">Minimal</option>
              <option value="standard">Standard</option>
              <option value="aggressive">Aggressive</option>
              <option value="full">Full</option>
            </select>
          </label>
          <label class="field-stack" for="canvasDriver">
            <span class="field-label">Canvas Driver</span>
            <select id="canvasDriver">
              <option value="software">Software</option>
              <option value="hardware">Hardware</option>
              <option value="hybrid">Hybrid</option>
              <option value="emulated">Emulated</option>
            </select>
          </label>
          <label class="field-stack" for="timezoneSeed">
            <span class="field-label">Timezone Seed</span>
            <input type="text" id="timezoneSeed" value="UTC-8" />
          </label>
          <label class="field-stack toggle-label" for="probeEnabled">
            <span class="field-label">Enable Probe</span>
            <input type="checkbox" id="probeEnabled" />
          </label>
          <button id="initiateProbeBtn" data-action="fingerprint.scan" type="button">Initiate Scan</button>
        </div>
      </section>
      <section class="metric-grid" aria-label="Fingerprint metrics">
        <article class="metric-card">
          <span class="metric-label">Signal entropy</span>
          <strong>High</strong>
          <span class="metric-delta positive">stable</span>
        </article>
        <article class="metric-card">
          <span class="metric-label">Driver fidelity</span>
          <strong>Full</strong>
          <span class="metric-delta neutral">+/-0.1</span>
        </article>
        <article class="metric-card">
          <span class="metric-label">Timezone drift</span>
          <strong>0ms</strong>
          <span class="metric-delta neutral">synced</span>
        </article>
        <article class="metric-card">
          <span class="metric-label">Projection size</span>
          <strong id="projectionSize">0</strong>
          <span class="metric-delta neutral">dimensions</span>
        </article>
      </section>
      <section class="workbench" aria-label="Probe workbench">
        <div class="workbench-main">
          <h2>Scan Context</h2>
          <p id="exportPreview">full / hardware / UTC-8</p>
          <div class="timeline">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <aside class="result-panel">
          <span class="field-label">Last fingerprint</span>
          <strong id="fpOutput">No scan yet</strong>
          <span id="exportScore">0</span>
          <span id="lastExportText">Scan queue ready</span>
        </aside>
      </section>
    </section>
  </main>
