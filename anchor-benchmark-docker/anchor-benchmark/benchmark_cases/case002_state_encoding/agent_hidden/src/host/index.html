  <title>Inventory Board State Encoding</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

<body data-case="case002_state_encoding">
  <main class="shell">
    <section class="search-band" aria-labelledby="boardTitle">
      <div class="search-panel">
        <h1 id="boardTitle">Inventory Board</h1>
        <form id="inventoryForm" class="search-form">
          <label class="field-block" for="zoneInput">
            <span>Zone</span>
            <input id="zoneInput" name="zone" type="text" autocomplete="off" value="" placeholder="north dock">
          </label>
          <label class="field-block" for="windowSelect">
            <span>Window</span>
            <select id="windowSelect" name="window">
              <option value="now">Now</option>
              <option value="hold">Hold window</option>
              <option value="replenish">Replenish</option>
              <option value="audit">Audit</option>
            </select>
          </label>
          <label class="field-block" for="batchCount">
            <span>Batch</span>
            <input id="batchCount" name="batch" type="number" min="1" max="99" step="1" value="4">
          </label>
          <label class="check-row" for="sealHold">
            <input id="sealHold" name="sealHold" type="checkbox">
            <span>Seal hold</span>
          </label>
          <button id="snapshotButton" type="button" data-intent="inventory.snapshot">Snapshot</button>
        </form>
        <output id="statusLine" class="status-line" aria-live="polite">Ready</output>
      </div>
    </section>
    <section class="results-grid" aria-label="Inventory rows">
      <article class="product-row" data-bin="bin-104">
        <span class="product-title">Dock buffer 104</span>
        <span class="product-meta">Ambient / two pending moves</span>
        <button id="bin104" type="button" class="pick-card" data-pick-sku="bin-104" data-pick-lane="ambient">Select</button>
      </article>
      <article class="product-row" data-bin="bin-219">
        <span class="product-title">Cold lane 219</span>
        <span class="product-meta">Cold / high priority hold</span>
        <button id="bin219" type="button" class="pick-card" data-pick-sku="bin-219" data-pick-lane="cold">Select</button>
      </article>
      <article class="product-row" data-bin="bin-322">
        <span class="product-title">Secure cage 322</span>
        <span class="product-meta">Secure / audit exception</span>
        <button id="bin322" type="button" class="pick-card" data-pick-sku="bin-322" data-pick-lane="secure">Select</button>
      </article>
    </section>
    <section id="resultShell" class="result-shell" aria-live="polite">
      <div class="result-line">
        <span>Last action</span>
        <b id="lastAction">none</b>
      </div>
      <div class="result-line">
        <span>State code</span>
        <b id="lastStateCode">pending</b>
      </div>
    </section>
  </main>
