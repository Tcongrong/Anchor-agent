<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transcode Buffer Lab</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Typed-Array Materialization</p>
          <h1>Transcode Buffer Lab</h1>
        </div>
        <div class="summary-strip" aria-label="Transcode scope summary">
          <span><strong id="selectedCodecLabel">hevc</strong> codec</span>
          <span><strong id="selectedRenderLabel">deferred</strong> render</span>
          <span><strong id="selectedBudgetLabel">480</strong> frames</span>
        </div>
      </header>

      <section class="planner-grid" aria-label="Transcode buffer controls">
        <div class="control-band">
          <label>
            <span>Codec profile</span>
            <select id="codecProfile">
              <option value="hevc" selected>hevc</option>
              <option value="h264">h264</option>
              <option value="av1">av1</option>
              <option value="prores">prores</option>
            </select>
          </label>
          <label>
            <span>Render mode</span>
            <select id="renderMode">
              <option value="deferred" selected>deferred</option>
              <option value="realtime">realtime</option>
              <option value="batch">batch</option>
            </select>
          </label>
          <label>
            <span>Frame budget</span>
            <input id="frameBudget" type="number" min="0" step="1" value="480" />
          </label>
          <label>
            <span>Operator tag</span>
            <input id="operatorTag" type="text" autocomplete="off" value="morgan" />
          </label>
          <label class="toggle-row">
            <span>Sync strict</span>
            <input id="syncStrict" type="checkbox" />
          </label>
          <div class="stage-actions">
            <button id="primeSessionButton" data-stage="prime" type="button">Prime session</button>
            <button id="packFramesButton" data-stage="pack" type="button">Pack frames</button>
            <button id="commitTranscodeButton" data-stage="commit" type="button">Commit transcode</button>
          </div>
        </div>
        <aside class="status-panel" aria-label="Transcode session panel">
          <dl>
            <dt>Transcode phase</dt>
            <dd id="transcodePhase">Idle</dd>
            <dt>Buffer state</dt>
            <dd id="bufferState">Cold</dd>
            <dt>Matched segments</dt>
            <dd id="segmentMatchCount">0</dd>
            <dt>Last action</dt>
            <dd id="lastAction">None</dd>
            <dt>Marker</dt>
            <dd id="shadowMarker">-</dd>
          </dl>
        </aside>
      </section>

      <section class="auxbar" aria-label="Transcode noise actions">
        <button data-transcode-noise="transcode.export.segment" type="button">Export segment</button>
        <button data-transcode-noise="transcode.frame.resync" type="button">Resync frames</button>
        <button data-transcode-noise="transcode.codec.warmup" type="button">Warm codec</button>
        <button data-transcode-noise="transcode.buffer.flush" type="button">Flush buffer</button>
        <button data-transcode-noise="transcode.reel.anchor" type="button">Anchor reel</button>
        <button data-transcode-noise="transcode.phase.shift" type="button">Shift phase</button>
      </section>

      <section class="table-panel" aria-label="Transcode clip catalog">
        <table>
          <thead>
            <tr>
              <th>Clip</th>
              <th>Reel</th>
              <th>State</th>
              <th>Operator</th>
              <th>Bitrate</th>
              <th>Age</th>
              <th>Region</th>
            </tr>
          </thead>
          <tbody id="clipRows"></tbody>
        </table>
      </section>

      <div id="transcodeQueueNode" class="hidden-node" aria-hidden="true"></div>
    </main>
