  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

<body data-case="case_002_hard">
  <main class="shell">
    <section class="panel" aria-labelledby="packetTitle">
      <div class="brandline">
        <span class="mark" aria-hidden="true"></span>
        <span class="brandcopy">Packet forge</span>
      </div>
      <h1 id="packetTitle">Byte Packet Builder</h1>
      <form class="packet-form" autocomplete="off">
        <label class="field" for="sourceBytes">
          <span>Source text</span>
          <textarea id="sourceBytes" name="source" rows="4" spellcheck="false" placeholder="delta frame 01"></textarea>
        </label>
        <label class="field" for="encodingMode">
          <span>Encoding mode</span>
          <select id="encodingMode" name="mode">
            <option value="xor">XOR lane</option>
            <option value="delta">Delta fold</option>
            <option value="mirror">Mirror frame</option>
          </select>
        </label>
        <label class="field" for="chunkSize">
          <span>Chunk size</span>
          <input id="chunkSize" name="chunk" type="number" min="3" max="11" value="7">
        </label>
        <label class="field" for="profileSelect">
          <span>Profile</span>
          <select id="profileSelect" name="profile">
            <option value="edge">Edge profile</option>
            <option value="bulk">Bulk profile</option>
            <option value="audit">Audit profile</option>
          </select>
        </label>
        <label class="remember" for="includeHeader">
          <input id="includeHeader" name="header" type="checkbox">
          <span>Include frame header</span>
        </label>
        <button id="stagePacket" type="button" data-k="12:43:3">Stage</button>
        <button id="emitPacket" type="button" data-k="12:43:8">Emit</button>
      </form>
      <output id="statusLine" aria-live="polite">Ready</output>
    </section>
    <section id="resultShell" class="result-shell" aria-live="polite">
      <div class="result-line">
        <span>Last action</span>
        <b id="lastAction">none</b>
      </div>
      <div class="result-line">
        <span>Signature state</span>
        <b id="lastSignature">pending</b>
      </div>
    </section>
  </main>
