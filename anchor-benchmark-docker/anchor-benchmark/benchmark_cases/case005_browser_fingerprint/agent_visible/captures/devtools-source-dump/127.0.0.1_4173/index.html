<body>
  <main class="shell" aria-labelledby="pageTitle">
    <section class="fingerprint-panel">
      <header class="panel-heading">
        <p class="eyebrow">Environment Register</p>
        <h1 id="pageTitle">Browser Fingerprint</h1>
        <p class="summary-copy">Capture the current browser environment profile and publish the local fingerprint.</p>
      </header>
      <div class="fingerprint-grid">
        <div class="line-item"><span class="item-name">Navigator</span><span class="item-meta">Platform, languages, device hints</span></div>
        <div class="line-item"><span class="item-name">Display</span><span class="item-meta">Screen metrics, media features, canvas mark</span></div>
      </div>
      <form id="fingerprintForm" class="actions" data-action="browser.fingerprint">
        <label class="mode-field" for="fingerprintMode">Profile</label>
        <select id="fingerprintMode" name="fingerprintMode">
          <option value="balanced">Balanced</option>
          <option value="strict">Strict</option>
          <option value="canvas">Canvas</option>
        </select>
        <label class="consent-field"><input id="entropyConsent" type="checkbox" name="entropyConsent"> Enable local entropy capture</label>
        <button id="publishFingerprint" type="submit">Publish fingerprint</button>
        <output id="fingerprintOutput" aria-live="polite">Awaiting capture</output>
      </form>
      <dl class="order-summary"><div><dt>Status</dt><dd id="fingerprintStatus">Ready</dd></div><div><dt>Register</dt><dd id="fingerprintRegister">Idle</dd></div><div><dt>Lane</dt><dd id="fingerprintLane">Local</dd></div></dl>
    </section>
  </main>
