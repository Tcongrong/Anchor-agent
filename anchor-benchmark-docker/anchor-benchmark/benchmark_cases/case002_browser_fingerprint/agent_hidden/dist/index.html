<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Signal Probe</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="panel" aria-labelledby="probeTitle">
      <div class="brandline">
        <span class="mark" aria-hidden="true"></span>
        <span class="brandcopy">Signal probe</span>
      </div>
      <h1 id="probeTitle">Browser Signal Probe</h1>
      <form class="packet-form" autocomplete="off">
        <label class="field" for="platformHint">
          <span>Platform hint</span>
          <textarea id="platformHint" name="platform" rows="4" spellcheck="false" placeholder="webkit x86"></textarea>
        </label>
        <label class="field" for="canvasMode">
          <span>Canvas mode</span>
          <select id="canvasMode" name="canvas">
            <option value="coarse">Coarse canvas</option>
            <option value="precise">Precise canvas</option>
            <option value="none">No canvas</option>
          </select>
        </label>
        <label class="field" for="audioTest">
          <span>Audio test</span>
          <select id="audioTest" name="audio">
            <option value="full">Full audio</option>
            <option value="lite">Lite audio</option>
            <option value="off">Audio off</option>
          </select>
        </label>
        <label class="field" for="timezoneMode">
          <span>Timezone mode</span>
          <select id="timezoneMode" name="timezone">
            <option value="utc">UTC fixed</option>
            <option value="local">Local zone</option>
            <option value="drift">Drift detect</option>
          </select>
        </label>
        <label class="field" for="probeScope">
          <span>Probe scope</span>
          <select id="probeScope" name="scope">
            <option value="local">Local scope</option>
            <option value="regional">Regional scope</option>
            <option value="global">Global scope</option>
          </select>
        </label>
        <button id="runAnalysis" type="button" data-k="11:29:8">Run Analysis</button>
      </form>
      <output id="statusLine" aria-live="polite">Ready</output>
    </section>
  </main>
  <script type="module" src="./assets/packet.app.bundle.js"></script>
</body>
</html>
