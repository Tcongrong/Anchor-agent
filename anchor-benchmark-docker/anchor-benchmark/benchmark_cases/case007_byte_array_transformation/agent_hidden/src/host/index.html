<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draft Preview Console</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="editor-card">
        <div class="topline">
          <span class="pill">Markdown</span>
          <span class="hint">Preview workspace</span>
        </div>

        <textarea
          id="markdownInput"
          spellcheck="false"
          placeholder="Write markdown here..."
        ></textarea>

        <div class="controls">
          <label>
            Preview mode
            <select id="previewMode">
              <option value="split">Split</option>
              <option value="compact">Compact</option>
              <option value="reader">Reader</option>
            </select>
          </label>

          <label>
            Array profile
            <select id="arrayProfile">
              <option value="dense">Dense</option>
              <option value="sparse">Sparse</option>
              <option value="header-biased">Header biased</option>
            </select>
          </label>

          <label>
            Byte window
            <input id="byteWindow" type="number" min="12" max="28" step="1" value="18" />
          </label>

          <label class="checkline">
            <input id="autoToc" type="checkbox" />
            Auto TOC
          </label>

          <label class="checkline">
            <input id="scrambleWhitespace" type="checkbox" />
            Whitespace lane
          </label>

          <button
            id="stageButton"
            data-command="draft.stage.array"
            type="button"
          >
            Stage
          </button>

          <button
            id="transformButton"
            data-command="draft.commit.array_transform"
            type="button"
          >
            Transform
          </button>
        </div>
      </section>

      <section class="preview-card">
        <div class="topline">
          <span class="pill alt">Preview</span>
          <span id="wordBadge">0 words</span>
        </div>
        <article id="previewPane"></article>
        <aside id="tocPane"></aside>
      </section>
    </main>

    <div id="draftStageNode" hidden aria-hidden="true"></div>
    <div id="draftQueueNode" hidden aria-hidden="true"></div>

    <script type="module" src="/src/z0/a0.js"></script>
  </body>
</html>
