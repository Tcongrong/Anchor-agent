    <section class="statebench-panel" aria-labelledby="pageTitle">
      <header class="topbar">

          <h1 id="pageTitle">State Encoding Console</h1>
        </div>
        <div class="status-pill" id="captureStatus">Ready</div>
      </header>
      <section class="control-strip" aria-label="State capture controls">
        <form id="stateForm">
          <label class="field-stack" for="stateScope">
            <span class="field-label">State Scope</span>
            <input type="text" id="stateScope" value="profile-panel" data-state-action="state.capture" />
          </label>
          <label class="field-stack" for="encodingMode">
            <span class="field-label">Encoding Mode</span>
            <select id="encodingMode">
              <option value="compact">Compact</option>
              <option value="stable">Stable</option>
              <option value="debug">Debug</option>
              <option value="share">Share</option>
            </select>
          </label>
          <label class="field-stack" for="stateLane">
            <span class="field-label">State Lane</span>
            <input type="text" id="stateLane" value="primary" />
          </label>
          <button id="captureButton" data-action="state.preview" type="button">Preview</button>
        </form>
      </section>
      <section class="metric-grid" aria-label="State metrics">
        <article class="metric-card">
          <span class="metric-label">Snapshot rows</span>
          <strong>482</strong>
          <span class="metric-delta positive">+8.2%</span>
        </article>
        <article class="metric-card">
          <span class="metric-label">Stability</span>
          <strong>42.8%</strong>
          <span class="metric-delta positive">+1.4%</span>
        </article>
        <article class="metric-card">
          <span class="metric-label">Open slots</span>
          <strong>37</strong>
          <span class="metric-delta neutral">stable</span>
        </article>
        <article class="metric-card">
          <span class="metric-label">Capture health</span>
          <strong id="stateProjectionSize">0</strong>
          <span class="metric-delta neutral">projection</span>
        </article>
      </section>
      <section class="workbench" aria-label="Capture workbench">
        <div class="workbench-main">
          <h2>Run Context</h2>
          <p id="statePreview">profile-panel / compact / primary</p>
          <div class="timeline">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <aside class="result-panel">
          <span class="field-label">Last output</span>
          <strong id="stateOutput">No capture yet</strong>
          <span id="stateScore">0</span>
          <span id="lastStateText">State lane ready</span>
        </aside>
      </section>
    </section>
