<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filter Query Board</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <section class="composer-panel" aria-labelledby="pageTitle">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local Filter Engine</p>
          <h1 id="pageTitle">Filter Query Board</h1>
        </div>
        <div class="status-pill" id="draftStatus">Engine ready</div>
      </header>
      <div class="layout-grid">
        <section class="note-editor" aria-label="Filter query composer">
          <form id="queryForm" data-filter-cmd="filter.run" novalidate>
            <div class="field-row">
              <div class="field-stack">
                <label class="field-label" for="queryScope">Scope</label>
                <select id="queryScope">
                  <option value="projects">Projects</option>
                  <option value="tasks">Tasks</option>
                  <option value="issues">Issues</option>
                </select>
              </div>
              <div class="field-stack">
                <label class="field-label" for="queryDepth">Depth</label>
                <select id="queryDepth">
                  <option value="shallow">Shallow</option>
                  <option value="standard">Standard</option>
                  <option value="deep">Deep</option>
                </select>
              </div>
            </div>
            <label class="field-label" for="queryTerm">Search term</label>
            <input id="queryTerm" type="text" autocomplete="off" placeholder="Enter keyword or phrase" />
            <div class="action-row">
              <button id="runQueryButton" type="submit">Run Filter</button>
              <span class="shortcut-copy">Local filter only</span>
            </div>
          </form>
        </section>
        <aside class="side-panel" aria-label="Query status">
          <div class="summary-grid">
            <div class="summary-tile">
              <span class="tile-label">Queued</span>
              <strong id="draftCount">0</strong>
            </div>
            <div class="summary-tile">
              <span class="tile-label">Scopes</span>
              <strong>3</strong>
            </div>
            <div class="summary-tile">
              <span class="tile-label">Depth levels</span>
              <strong>3</strong>
            </div>
            <div class="summary-tile">
              <span class="tile-label">Remote</span>
              <strong>Off</strong>
            </div>
          </div>
          <div class="priority-strip" aria-hidden="true">
            <span class="tone-low"></span>
            <span class="tone-normal"></span>
            <span class="tone-high"></span>
          </div>
          <div class="preview-box">
            <p class="preview-title">Last query</p>
            <p id="previewText">No filter applied yet.</p>
          </div>
        </aside>
      </div>
      <section class="list-section" aria-label="Filter results">
        <div class="section-head">
          <h2>Applied Filters</h2>
          <span id="listMeta">0 items</span>
        </div>
        <ul id="resultList"></ul>
      </section>
    </section>
  </main>
