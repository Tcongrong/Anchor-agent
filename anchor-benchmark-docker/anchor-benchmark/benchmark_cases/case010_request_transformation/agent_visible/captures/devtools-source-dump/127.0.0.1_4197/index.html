    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Media Desk</p>
          <h1>Play Request Console</h1>
        </div>
        <div class="summary-strip" aria-label="Media preview status">
          <span><strong id="selectedFilterLabel">cinema</strong> profile</span>
          <span><strong id="selectedPlaylistLabel">launch_reel</strong> codec</span>
          <span><strong id="selectedQualityLabel">1080p</strong> render</span>
        </div>
      </header>
      <section class="planner-grid" aria-label="Media play controls">
        <div id="mediaPlayPanel" class="control-band" data-action="media.play.dispatch">
          <label>
            <span>Color profile</span>
            <select id="filterSelect" name="filterSelect">
              <option value="cinema" selected>cinema</option>
              <option value="mono">mono</option>
              <option value="noir">noir</option>
              <option value="vivid">vivid</option>
              <option value="archive">archive</option>
              <option value="soft">soft</option>
            </select>
          </label>
          <label>
            <span>Codec lane</span>
            <select id="playlistSelect" name="playlistSelect">
              <option value="launch_reel" selected>launch_reel</option>
              <option value="studio_loop">studio_loop</option>
              <option value="teaser_pack">teaser_pack</option>
              <option value="demo_cut">demo_cut</option>
              <option value="night_roll">night_roll</option>
              <option value="daily_mix">daily_mix</option>
            </select>
          </label>
          <label>
            <span>Render tier</span>
            <select id="qualitySelect" name="qualitySelect">
              <option value="480p">480p</option>
              <option value="720p">720p</option>
              <option value="1080p" selected>1080p</option>
              <option value="1440p">1440p</option>
              <option value="4k">4k</option>
              <option value="source">source</option>
            </select>
          </label>
          <div class="control-actions">
            <button id="pinMatrixButton" type="button" data-phase="pin">Pin matrix</button>
            <button id="queuePlaybackButton" type="button" data-phase="queue">Queue playback</button>
            <button id="dispatchRequestButton" type="button" data-phase="dispatch">Dispatch request</button>
          </div>
        </div>
        <aside class="status-panel" aria-label="Media status panel">
          <dl>
            <dt>Queue</dt>
            <dd id="queueStatus">Idle</dd>
            <dt>Route</dt>
            <dd id="routeStatus">Waiting</dd>
            <dt>Last action</dt>
            <dd id="lastAction">None</dd>
            <dt>Marker</dt>
            <dd id="shadowMarker">-</dd>
          </dl>
        </aside>
      </section>
