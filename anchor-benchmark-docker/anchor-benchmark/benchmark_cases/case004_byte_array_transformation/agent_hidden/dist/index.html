<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch Data Encoder</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="panel encoder-layout" aria-labelledby="batchTitle">
      <div class="brandline">
        <span class="mark" aria-hidden="true"></span>
        <span class="brandcopy">Batch forge</span>
      </div>
      <h1 id="batchTitle">Batch Data Encoder</h1>
      <p class="panel-note">Enter a batch key and compression mode, then encode to emit a console payload.</p>
      <div class="encoder-form batch-form" autocomplete="off">
        <label class="field" for="batchKey">
          <span>Batch Key</span>
          <input id="batchKey" name="batchKey" type="text" value="REC-7749" maxlength="32" spellcheck="false" autocomplete="off">
        </label>
        <label class="field" for="compressionMode">
          <span>Compression Mode</span>
          <select id="compressionMode" name="compressionMode">
            <option value="lz4">LZ4</option>
            <option value="zstd" selected>ZSTD</option>
            <option value="none">None</option>
          </select>
        </label>
        <button id="encodeButton" type="button" data-op="batch.encode">Encode Package</button>
      </div>
      <div id="encoderStatus" aria-live="polite">Ready</div>
    </section>
  </main>
  <script type="module" src="./assets/batch.app.bundle.js"></script>
</body>
</html>
