<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annotation Workspace</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">Quick Capture</p>
        <h1>New Annotation</h1>
        <p class="hint">
          Write a note and tag it before saving to the annotation lane.
        </p>

        <form id="annotationForm" action="" method="">
          <label>
            Note text
            <textarea
              id="noteText"
              rows="4"
              placeholder="Describe your observation or action item..."
              autocomplete="off"
            ></textarea>
          </label>

          <label>
            Category
            <select id="noteCategory">
              <option value="note">note</option>
              <option value="task">task</option>
              <option value="reminder">reminder</option>
              <option value="insight">insight</option>
            </select>
          </label>

          <label>
            Tag
            <input
              id="noteTag"
              type="text"
              autocomplete="off"
              placeholder="e.g. q2-review"
            />
          </label>

          <button id="submitNote" type="submit">
            Save annotation
          </button>
        </form>
      </section>

      <aside class="side">
        <h2>Recent notes</h2>
        <ul id="recentList">
          <li>quarterly targets / insight</li>
          <li>onboarding flow / task</li>
          <li>sprint retro / note</li>
        </ul>

        <div class="meter">
          <span>Note lane</span>
          <div class="bar"><i id="noteBar"></i></div>
        </div>

        <div class="badge" id="noteBadge">tag: pending</div>
      </aside>
    </main>

    <script type="module" src="/src/annotationCase/main.js"></script>
  </body>
</html>
