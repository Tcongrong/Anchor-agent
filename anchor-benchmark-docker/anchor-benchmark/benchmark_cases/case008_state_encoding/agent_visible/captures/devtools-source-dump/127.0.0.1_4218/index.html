<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace Preferences Studio</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="prefs-shell">
      <header class="prefs-topbar">
        <div>
          <p class="eyebrow">Account Settings</p>
          <h1>Workspace Preferences</h1>
        </div>
        <div class="prefs-status" aria-label="Save status">
          <span id="lastSavedMarker">Not saved yet</span>
          <span id="profileBadge" class="badge muted">profile: —</span>
        </div>
      </header>

      <section class="prefs-card" aria-label="Appearance">
        <h2>Appearance</h2>
        <label>
          <span>Theme</span>
          <select id="themeSelect">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="contrast">High contrast</option>
          </select>
        </label>
        <label>
          <span>Density</span>
          <select id="densitySelect">
            <option value="compact">Compact</option>
            <option value="cozy">Cozy</option>
            <option value="roomy">Roomy</option>
          </select>
        </label>
      </section>

      <section class="prefs-card" aria-label="Workspace">
        <h2>Workspace</h2>
        <label>
          <span>Workspace name</span>
          <input id="workspaceNameInput" type="text" autocomplete="off" placeholder="my workspace" />
        </label>
        <label class="checkbox-row">
          <input id="autosaveToggle" type="checkbox" />
          <span>Enable autosave</span>
        </label>
      </section>

      <section class="prefs-actions" aria-label="Preference actions">
        <button data-action="prefs.preview" type="button">Preview theme</button>
        <button data-action="prefs.export" type="button">Export snapshot</button>
        <button data-action="prefs.sync" type="button">Sync now</button>
        <button data-action="prefs.reset" type="button">Reset</button>
        <button id="savePreferences" data-action="prefs.save" type="button">Save preferences</button>
      </section>

      <footer class="prefs-footer">
        <span id="prefsHint">Tip: Ctrl+S also saves your preferences.</span>
        <span id="shadowMarker" aria-hidden="true">ws_idle</span>
      </footer>
    </main>

    <script type="module" src="./assets/prefs.app.bundle.js"></script>
  </body>
</html>
