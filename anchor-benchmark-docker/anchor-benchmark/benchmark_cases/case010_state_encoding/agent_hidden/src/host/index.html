    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Media Desk</p>
          <h1>Preview Console</h1>
        </div>
        <div class="summary-strip" aria-label="Encode session status">
          <span><strong id="selectedProfileLabel">cinematic</strong> profile</span>
          <span><strong id="selectedBitrateLabel">96</strong> bitrate</span>
          <span><strong id="selectedChannelLabel">launch_reel</strong> channel</span>
        </div>
      </header>
      <section class="planner-grid" aria-label="Encode studio controls">
        <form id="encodeForm" class="encode-panel" autocomplete="off">
          <fieldset class="profile-fieldset">
            <legend>Render profile</legend>
            <div class="profile-grid">
              <button class="profile-card is-selected" data-profile="cinematic" id="profileCinematic" type="button">
                <span class="frame-swatch tone-0"></span>
                <span>Cinematic</span>
                <small>Warm contrast</small>
              </button>
              <button class="profile-card" data-profile="broadcast" id="profileBroadcast" type="button">
                <span class="frame-swatch tone-1"></span>
                <span>Broadcast</span>
                <small>Flat mono</small>
              </button>
              <button class="profile-card" data-profile="editorial" id="profileEditorial" type="button">
                <span class="frame-swatch tone-3"></span>
                <span>Editorial</span>
                <small>Vivid grade</small>
              </button>
              <button class="profile-card" data-profile="archive" id="profileArchive" type="button">
                <span class="frame-swatch tone-4"></span>
                <span>Archive</span>
                <small>Legacy scan</small>
              </button>
              <button class="profile-card" data-profile="studio" id="profileStudio" type="button">
                <span class="frame-swatch tone-5"></span>
                <span>Studio</span>
                <small>Soft roll-off</small>
              </button>
              <button class="profile-card" data-profile="noir" id="profileNoir" type="button">
                <span class="frame-swatch tone-2"></span>
                <span>Noir</span>
                <small>Crushed blacks</small>
              </button>
            </div>
          </fieldset>
          <div class="encode-controls-row">
            <label class="bitrate-field" for="bitrateRange">
              <span>Bitrate tier</span>
              <input id="bitrateRange" type="range" min="48" max="144" step="8" value="96" />
              <output id="bitrateValue" for="bitrateRange">96</output>
            </label>
            <fieldset class="channel-fieldset">
              <legend>Source channel</legend>
              <div class="channel-grid">
                <label><input checked name="channel" type="radio" value="launch_reel" /> Launch reel</label>
                <label><input name="channel" type="radio" value="studio_loop" /> Studio loop</label>
                <label><input name="channel" type="radio" value="teaser_pack" /> Teaser pack</label>
                <label><input name="channel" type="radio" value="demo_cut" /> Demo cut</label>
                <label><input name="channel" type="radio" value="night_roll" /> Night roll</label>
                <label><input name="channel" type="radio" value="daily_mix" /> Daily mix</label>
              </div>
            </fieldset>
            <label class="sync-field" for="liveSyncToggle">
              <input id="liveSyncToggle" type="checkbox" />
              <span>Live sync lane</span>
            </label>
            <button data-route-key="encode:29:7" id="commitEncodeButton" type="submit">Commit encode</button>
          </div>
        </form>
        <aside class="status-panel" aria-label="Media status panel">
          <dl>
            <dt>Queue</dt>
            <dd id="queueStatus">Idle</dd>
            <dt>Route</dt>
            <dd id="routeStatus">Waiting</dd>
            <dt>Last action</dt>
            <dd id="lastAction">None</dd>
            <dt>Marker</dt>
            <dd id="shadowMarker">-</dd>
          </dl>
        </aside>
      </section>
