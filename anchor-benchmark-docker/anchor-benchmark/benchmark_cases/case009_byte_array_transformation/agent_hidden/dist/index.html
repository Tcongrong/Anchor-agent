<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Byte Lane Materializer</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Typed Buffer Desk</p>
          <h1>Byte Lane Materializer</h1>
        </div>
        <div class="summary-strip" aria-label="Scope summary">
          <span><strong id="selectedScopeLabel">baseline</strong> scope</span>
          <span><strong id="selectedLedgerLabel">all</strong> ledger</span>
          <span><strong id="selectedFloorLabel">0</strong> floor</span>
        </div>
      </header>

      <section class="planner-grid" aria-label="Lane materializer controls">
        <div class="control-band">
          <label>
            <span>Scope band</span>
            <select id="scopeBand">
              <option value="baseline" selected>baseline</option>
              <option value="narrow">narrow</option>
              <option value="wide">wide</option>
            </select>
          </label>
          <label>
            <span>Ledger slice</span>
            <select id="ledgerSlice">
              <option value="all">all</option>
              <option value="open">open</option>
              <option value="pending">pending</option>
              <option value="closed">closed</option>
            </select>
          </label>
          <label>
            <span>Floor units</span>
            <input id="floorUnits" type="number" min="0" step="1" placeholder="0" />
          </label>
          <label>
            <span>Custodian tag</span>
            <input id="custodianTag" type="text" autocomplete="off" placeholder="custodian" />
          </label>
          <label class="toggle-row">
            <span>Parity lock</span>
            <input id="parityLock" type="checkbox" />
          </label>
          <div class="stage-actions">
            <button id="bootLaneButton" data-stage="boot" type="button">Boot lane</button>
            <button id="bindScopeButton" data-stage="bind" type="button">Bind scope</button>
            <button id="emitBufferButton" data-stage="emit" type="button">Emit buffer</button>
          </div>
        </div>
        <aside class="status-panel" aria-label="Lane session panel">
          <dl>
            <dt>Lane stage</dt>
            <dd id="laneStage">Idle</dd>
            <dt>Buffer session</dt>
            <dd id="bufferSession">Cold</dd>
            <dt>Matched rows</dt>
            <dd id="laneMatchCount">0</dd>
            <dt>Last action</dt>
            <dd id="lastAction">None</dd>
            <dt>Marker</dt>
            <dd id="shadowMarker">-</dd>
          </dl>
        </aside>
      </section>

      <section class="auxbar" aria-label="Lane noise actions">
        <button data-lane-noise="lane.export.preview" type="button">Export lane</button>
        <button data-lane-noise="lane.page.shift" type="button">Shift page</button>
        <button data-lane-noise="lane.columns.freeze" type="button">Freeze columns</button>
        <button data-lane-noise="lane.badge.resync" type="button">Resync badges</button>
        <button data-lane-noise="lane.view.anchor" type="button">Anchor view</button>
        <button data-lane-noise="lane.queue.flush" type="button">Flush queue</button>
      </section>

      <section class="table-panel" aria-label="Source ledger preview">
        <table>
          <thead>
            <tr>
              <th>Invoice</th>
              <th>Account</th>
              <th>Status</th>
              <th>Owner</th>
              <th>Amount</th>
              <th>Age</th>
              <th>Region</th>
            </tr>
          </thead>
          <tbody id="invoiceRows"></tbody>
        </table>
      </section>

      <div id="localQueueNode" class="hidden-node" aria-hidden="true"></div>
    </main>
