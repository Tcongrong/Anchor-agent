<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quick Notes</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="note-shell">
      <form
        id="draftComposer"
        class="composer"
        aria-labelledby="pageTitle"
        data-shortcut-command="note.shortcut.commit"
        data-state-lane="field-notes"
      >
        <div class="title-row">
          <div>
            <p class="eyebrow">Local notebook</p>
            <h1 id="pageTitle">Quick Notes</h1>
          </div>
          <span id="draftStatus" class="status-pill" aria-live="polite">Draft ready</span>
        </div>

        <label class="field">
          <span>Note</span>
          <textarea id="noteText" rows="7" placeholder="Write a note"></textarea>
        </label>

        <div class="inline-fields">
          <label class="field">
            <span>Tag</span>
            <input id="tagInput" type="text" placeholder="work" />
          </label>

          <label class="field">
            <span>Priority</span>
            <select id="prioritySelect">
              <option value="low">Low</option>
              <option value="normal" selected>Normal</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>

        <div class="toolbar">
          <button id="previewButton" class="secondary-button" type="button">
            Refresh Preview
          </button>
          <button id="snapshotButton" class="icon-button" type="button" aria-label="Snapshot">
            ↶
          </button>
        </div>
      </form>

      <aside class="preview" aria-label="Draft Preview">
        <div class="preview-head">
          <div>
            <p class="eyebrow">Preview</p>
            <h2>Draft Board</h2>
          </div>
          <span id="prioritySwatch" class="priority-swatch" aria-hidden="true"></span>
        </div>

        <div id="draftPreview" class="draft-preview">
          <p class="muted">No saved notes yet.</p>
        </div>

        <div class="filter-strip" aria-label="Tag filters">
          <button type="button" class="chip is-active">All</button>
          <button type="button" class="chip">Work</button>
          <button type="button" class="chip">Personal</button>
        </div>

        <ul id="noteList" class="note-list"></ul>
      </aside>
    </main>

    <script type="module" src="/src/noteBench/main.js"></script>
  </body>
</html>
