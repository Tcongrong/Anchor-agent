<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browser Signal Probe</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <section class="composer-panel" aria-labelledby="pageTitle">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local Capability Lab</p>
          <h1 id="pageTitle">Browser Signal Probe</h1>
        </div>
        <div class="status-pill" id="probeStatus">Probe ready</div>
      </header>
      <div class="layout-grid">
        <section class="note-editor" id="probePanel" data-pulse-cmd="fingerprint.pulse" aria-label="Browser signal probe">
            <div class="field-row">
              <div class="field-stack">
                <label class="field-label" for="canvasMode">Canvas probe</label>
                <select id="canvasMode">
                  <option value="coarse">Coarse</option>
                  <option value="precise">Precise</option>
                  <option value="vector">Vector</option>
                </select>
              </div>
              <div class="field-stack">
                <label class="field-label" for="audioMode">Audio probe</label>
                <select id="audioMode">
                  <option value="muted">Muted</option>
                  <option value="basic">Basic</option>
                  <option value="full">Full</option>
                </select>
              </div>
            </div>
            <label class="field-label" for="platformHint">Platform hint</label>
            <input id="platformHint" type="text" autocomplete="off" placeholder="Optional platform label" />
            <label class="field-label" for="probeScope">Probe scope</label>
            <select id="probeScope">
              <option value="local">Local preview</option>
              <option value="global">Global scan</option>
              <option value="extended">Extended preview</option>
            </select>
            <label class="arm-row" for="probeArm">
              <input id="probeArm" type="checkbox" />
              <span>Arm live fingerprint channel</span>
            </label>
            <div class="action-row">
              <button id="runProbeButton" type="button" data-pulse-lane="scan">Pulse Analysis</button>
              <span class="shortcut-copy">Armed main-thread pulse</span>
            </div>
        </section>
        <aside class="side-panel" aria-label="Probe status">
          <div class="summary-grid">
            <div class="summary-tile">
              <span class="tile-label">Scans</span>
              <strong id="probeCount">0</strong>
            </div>
            <div class="summary-tile">
              <span class="tile-label">Canvas</span>
              <strong>3</strong>
            </div>
            <div class="summary-tile">
              <span class="tile-label">Audio</span>
              <strong>3</strong>
            </div>
            <div class="summary-tile">
              <span class="tile-label">Thread</span>
              <strong>Main</strong>
            </div>
          </div>
          <div class="priority-strip" aria-hidden="true">
            <span class="tone-low"></span>
            <span class="tone-normal"></span>
            <span class="tone-high"></span>
          </div>
          <div class="preview-box">
            <p class="preview-title">Probe configuration</p>
            <p id="previewText">No scan configured yet.</p>
          </div>
        </aside>
      </div>
      <section class="list-section" aria-label="Fingerprint results">
        <div class="section-head">
          <h2>Fingerprint Scans</h2>
          <span id="listMeta">0 items</span>
        </div>
        <ul id="resultList"></ul>
      </section>
    </section>
  </main>
