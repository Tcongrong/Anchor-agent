  <main class="shell" aria-labelledby="pageTitle">
    <section class="signature-panel">
      <header class="panel-heading">
        <p class="eyebrow">Request Proof Register</p>
        <h1 id="pageTitle">Request Signature</h1>
        <p class="summary-copy">Prepare a protected request envelope and publish the local proof token.</p>
      </header>
      <div class="signature-grid">
        <div class="line-item"><span class="item-name">Route</span><span class="item-meta">Method, resource path and tenant lane</span></div>
        <div class="line-item"><span class="item-name">Proof</span><span class="item-meta">Nonce window, body class and replay guard</span></div>
      </div>
      <form id="signatureForm" class="actions" data-action="vault.sign">
        <label class="mode-field" for="requestPath">Resource</label>
        <input id="requestPath" name="requestPath" value="/vault/ledger/8492/close">
        <label class="mode-field" for="signatureMode">Environment</label>
        <select id="signatureMode" name="signatureMode">
          <option value="stage">Stage</option>
          <option value="prod">Prod</option>
          <option value="edge">Edge</option>
        </select>
        <label class="mode-field" for="requestMethod">Method</label>
        <select id="requestMethod" name="requestMethod">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
          <option value="PATCH">PATCH</option>
        </select>
        <label class="mode-field" for="bodyClass">Body class</label>
        <select id="bodyClass" name="bodyClass">
          <option value="compact">Compact</option>
          <option value="ledger-close">Ledger close</option>
          <option value="grant-rotate">Grant rotate</option>
        </select>
        <label class="mode-field" for="nonceInput">Nonce</label>
        <input id="nonceInput" name="nonceInput" value="n-8492-06">
        <label class="consent-field"><input id="entropyConsent" type="checkbox" name="entropyConsent"> Enable replay guard</label>
        <button id="prepareEnvelope" type="button" data-step="prepare">Prepare envelope</button>
        <button id="publishSignature" type="button" data-step="publish">Release proof</button>
        <output id="signatureOutput" aria-live="polite">Awaiting request proof</output>
      </form>
      <dl class="order-summary"><div><dt>Status</dt><dd id="signatureStatus">Ready</dd></div><div><dt>Register</dt><dd id="signatureRegister">Idle</dd></div><div><dt>Lane</dt><dd id="signatureLane">Proof</dd></div></dl>
    </section>
