    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manifest Seal Console</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />

  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Manifest Desk</p>
          <h1>Seal Console</h1>
        </div>
        <div class="summary-strip" aria-label="Manifest seal status">
          <span><strong id="selectedCarrierLabel">edge-cdn</strong> carrier</span>
          <span><strong id="selectedPriorityLabel">6</strong> priority</span>
          <span><strong id="selectedManifestLabel">MFST-8842-ALPHA</strong> manifest</span>
          <span><strong id="selectedWindowLabel">afternoon</strong> window</span>
        </div>
      </header>
      <section class="planner-grid" aria-label="Manifest seal controls">
        <form id="manifestSealForm" class="control-band encode-panel" autocomplete="off">
          <fieldset class="channel-fieldset">
            <legend>Carrier route</legend>
            <div class="channel-grid">
              <label><input checked name="carrierRoute" type="radio" value="edge-cdn" /> Edge CDN</label>
              <label><input name="carrierRoute" type="radio" value="origin-pull" /> Origin pull</label>
              <label><input name="carrierRoute" type="radio" value="peer-mesh" /> Peer mesh</label>
            </div>
          </fieldset>
          <label class="bitrate-field" for="priorityBand">
            <span>Priority band</span>
            <input id="priorityBand" type="range" min="1" max="9" step="1" value="6" />
            <output id="priorityValue" for="priorityBand">6</output>
          </label>
          <label>
            <span>Delivery window</span>
            <select id="deliveryWindow">
              <option value="morning">morning</option>
              <option value="afternoon" selected>afternoon</option>
              <option value="evening">evening</option>
              <option value="overnight">overnight</option>
            </select>
          </label>
          <label class="request-ref-field" for="manifestId"><span>Manifest ID</span><input id="manifestId" type="text" value="MFST-8842-ALPHA" autocomplete="off" /></label>
          <fieldset class="channel-fieldset">
            <legend>Integrity binding</legend>
            <div class="channel-grid">
              <label><input name="integrityMode" type="radio" value="checksum" /> Checksum</label>
              <label><input checked name="integrityMode" type="radio" value="nonce-bind" /> Nonce bind</label>
            </div>
          </fieldset>
          <button id="snapshotManifestButton" data-phase="snapshot" type="button">Snapshot manifest</button>
          <button id="issueSealButton" data-phase="issue" type="submit">Issue seal</button>
        </form>
        <aside class="status-panel" aria-label="Media status panel">
          <dl>
            <dt>Queue</dt>
            <dd id="queueStatus">Idle</dd>
            <dt>Route</dt>
            <dd id="routeStatus">Waiting</dd>
            <dt>Last action</dt>
            <dd id="lastAction">None</dd>
            <dt>Marker</dt>
            <dd id="shadowMarker">-</dd>
          </dl>
        </aside>
      </section>
