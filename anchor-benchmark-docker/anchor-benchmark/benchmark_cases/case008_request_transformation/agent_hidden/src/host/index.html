<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operations Table Console</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Operations Ledger</p>
          <h1>Receivables Workbench</h1>
        </div>
        <div class="summary-strip" aria-label="Table summary">
          <span><strong id="visibleCount">0</strong> visible</span>
          <span><strong id="pageNumber">1</strong> page</span>
          <span><strong id="layoutMode">compact</strong> layout</span>
        </div>
      </header>

      <section class="toolbar" aria-label="Filter toolbar">
        <label>
          <span>Status</span>
          <select id="statusFilter">
            <option value="all">All</option>
            <option value="open">Open</option>
            <option value="pending">Pending</option>
            <option value="closed">Closed</option>
          </select>
        </label>

        <label>
          <span>Minimum amount</span>
          <input id="minAmount" type="number" min="0" step="1" placeholder="0" />
        </label>

        <label>
          <span>Owner</span>
          <input id="ownerInput" type="text" autocomplete="off" placeholder="owner name" />
        </label>

        <label>
          <span>Region</span>
          <select id="regionFilter">
            <option value="all">All</option>
            <option value="north">North</option>
            <option value="south">South</option>
            <option value="east">East</option>
            <option value="west">West</option>
          </select>
        </label>

        <label>
          <span>Request profile</span>
          <select id="requestProfile">
            <option value="standard">Standard</option>
            <option value="audit">Audit</option>
            <option value="escalation">Escalation</option>
          </select>
        </label>

        <label class="check-row">
          <input id="agedOnly" type="checkbox" />
          <span>Aged only</span>
        </label>

        <div class="button-row">
          <button id="stageRequest" data-action="table.request.stage" type="button">Analyze Scope</button>
          <button id="prepareRequest" data-action="table.request.prepare" type="button">Prepare Request</button>
          <button data-action="table.filter.clear" type="button">Clear</button>
        </div>
      </section>

      <section class="auxbar" aria-label="Table actions">
        <button data-action="table.export.preview" type="button">Export</button>
        <button data-action="table.page.prev" type="button">Prev Page</button>
        <button data-action="table.page.next" type="button">Next Page</button>
        <button data-action="table.columns.save" type="button">Save Columns</button>
        <button data-action="table.badge.refresh" type="button">Refresh Badges</button>
        <button data-action="table.view.pin" type="button">Pin View</button>
      </section>

      <section class="badge-line" aria-label="Applied filters" id="filterBadges">
        <span class="badge muted">No filter applied</span>
      </section>

      <section class="table-panel" aria-label="Receivables table">
        <table>
          <thead>
            <tr>
              <th>Invoice</th>
              <th>Account</th>
              <th>Status</th>
              <th>Owner</th>
              <th>Amount</th>
              <th>Age</th>
              <th>Region</th>
            </tr>
          </thead>
          <tbody id="invoiceRows"></tbody>
        </table>
      </section>

      <footer class="status-line">
        <span id="lastAction">Ready</span>
        <span id="stageTicket" aria-hidden="true">stage_idle</span>
        <span id="shadowMarker" aria-hidden="true">qf_idle</span>
      </footer>
    </main>

    <script type="module" src="/src/filterCase/main.js"></script>
  </body>
</html>
