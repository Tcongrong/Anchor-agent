<body>
  <main class="shell" aria-labelledby="pageTitle">
    <section class="fingerprint-panel">
      <header class="panel-heading">
        <p class="eyebrow">Query Transform Register</p>
        <h1 id="pageTitle">Request Transformation</h1>
        <p class="summary-copy">Build and submit a normalized query payload for request transformation.</p>
      </header>
      <div class="fingerprint-grid">
        <div class="line-item"><span class="item-name">Scope</span><span class="item-meta">Search scope, filter mode, sort order</span></div>
        <div class="line-item"><span class="item-name">Options</span><span class="item-meta">Page size, limit, transform parameters</span></div>
      </div>
      <form id="queryForm" class="actions" data-action="request.transform">
        <label class="mode-field" for="searchScope">Search Scope</label>
        <input id="searchScope" name="searchScope" type="text" value="logs-ops">
        <label class="mode-field" for="filterMode">Filter Mode</label>
        <select id="filterMode" name="filterMode">
          <option value="all">All</option>
          <option value="strict">Strict</option>
          <option value="partial">Partial</option>
        </select>
        <label class="mode-field" for="sortField">Sort Order</label>
        <select id="sortField" name="sortField">
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
        </select>
        <input id="pageSize" name="pageSize" type="hidden" value="20">
        <input id="limitField" name="limitField" type="hidden" value="100">
        <label class="consent-field"><input id="filterEnabled" type="checkbox" name="filterEnabled"> Enable filter transform</label>
        <button id="querySubmit" type="submit">Submit query</button>
        <output id="queryOutput" aria-live="polite">Awaiting transform</output>
      </form>
      <dl class="order-summary"><div><dt>Status</dt><dd id="queryStatus">Ready</dd></div><div><dt>Register</dt><dd id="queryRegister">Idle</dd></div><div><dt>Lane</dt><dd id="queryLane">Local</dd></div></dl>
    </section>
  </main>
