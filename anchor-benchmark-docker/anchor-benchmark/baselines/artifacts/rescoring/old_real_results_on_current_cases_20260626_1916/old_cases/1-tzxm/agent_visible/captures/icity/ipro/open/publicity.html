			onQueryFuma(1);

		/*核准数据*/
	function onQueryHezhun(start) {
		qrCheck().then(function (ret) {
			var cmd = new LEx.Command("jxtzxm.app.icity.ipro.IproCmd");
			cmd.setParameter("page", start+"");
			cmd.setParameter("rows", limit+"");
			cmd.setParameter("projectType", "A00001,A00002");
			cmd.setParameter("currentState", "A0501,A0503");
			cmd.setParameter("verifyCode", verifyCode);
			cmd.setParameter("flag", "1");
			var projectName= $("#projectName").val();
			cmd.setParameter("projectName", $("#projectName").val());
			var projectCode=$("#projectCode").val();
			cmd.setParameter("projectCode", $("#projectCode").val());
			var dataTypeHZ = $('#dataTypeHZ').val();
			cmd.setParameter('searchType',dataTypeHZ==undefined?"week":dataTypeHZ)
			var ret = cmd.execute("getBusinessListByProjectCode");
			if (!ret.error) {
				// pageTotal_hezhun = Math.ceil(ret.total/limit);
				pageTotal_hezhun = Math.ceil(ret.data.totalPage);
				$("#list_hezhun").html(LEx.processDOMTemplate("template_list_hezhun",ret.data.pageList));
				$("#projectName").val(projectName);
